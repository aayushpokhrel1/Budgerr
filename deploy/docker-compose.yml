name: budgerr-stack

# Budgerr's Postgres is MANAGED (Supabase), not a service here — see
# docs/superpowers/specs/2026-09-29-cloud-deploy-design.md. That is deliberate:
# with no stateful Budgerr service, the box holds nothing that cannot be rebuilt
# from the runbook, which is what makes an Oracle Always Free instance (subject
# to idle reclaim) a safe place to run this.
#
# Consequence: DATABASE_URL is NOT overridden below. backend/.env owns it, and it
# must point at Supabase's SESSION pooler (port 5432 on ...pooler.supabase.com).
# The direct connection is IPv6-only and the transaction pooler on 6543 breaks
# psycopg3's prepared statements. See the comment at backend/app/config.py.
services:
  budgerr-api:
    build:
      context: ../backend
    restart: unless-stopped
    # Secrets (DATABASE_URL, BUDGERR_API_KEYS, AUTH_ENABLED, PLAID_*,
    # PLAYSTAT_API_KEY, NTFY_*, ANTHROPIC_API_KEY) come from backend/.env.
    env_file:
      - ../backend/.env
    environment:
      PLAYSTAT_BASE_URL: http://playstat-api:8000
    ports:
      - "127.0.0.1:8001:8001"   # loopback only: Funnel/serve + systemd cron proxy from localhost; never exposed on the LAN

  # ---------------------------------------------------------------------------
  # playstat: NOT STARTED YET. Budgerr deployed to the cloud first, on its own —
  # the July design's "both APIs move together" coupling is what stalled this
  # deploy for two months, and it turned out to cost nothing to split (spec §6).
  #
  # Start Budgerr alone with:  docker compose up -d budgerr-api
  # Until playstat runs, PLAYSTAT_BASE_URL above fails DNS, which both call sites
  # already handle: the proxy returns a clean 502 and auto-settle leaves bets
  # pending. `/playstat/*` returning 502 is EXPECTED, not a broken deploy.
  #
  # To add playstat later: clone it as a sibling of Budgerr (build contexts below
  # are relative to this directory) and `docker compose up -d playstat-db
  # playstat-api`. No changes needed here.
  # ---------------------------------------------------------------------------
  playstat-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: playstat
      POSTGRES_PASSWORD: playstat
      POSTGRES_DB: playstat
    volumes:
      - playstat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playstat"]
      interval: 10s
      timeout: 5s
      retries: 5

  playstat-api:
    # Dockerfile is authored and owned by the playstat repo (../../playstat),
    # which Budgerr never writes into. It exists as of playstat 82de4db
    # (python:3.11-slim + libgomp1 for xgboost's runtime OpenMP link + curl).
    # NOTE: this is ONE image with TWO uses — the API service (default CMD)
    # and the daily batch chain (`python -m modeling.clv`, `python -m
    # optimizer.parlay ...`) run as different commands off the same image.
    build:
      context: ../../playstat
    restart: unless-stopped
    depends_on:
      playstat-db:
        condition: service_healthy
    env_file:
      - path: ../../playstat/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://playstat:playstat@playstat-db:5432/playstat
    # playstat's /health is auth-exempt by design (api/auth.py PUBLIC_PATHS), so
    # no API key is needed here. It returns {"status":"ok","database":"ok"}, or
    # 503 when Postgres is unreachable — a real DB check, not just liveness.
    # curl is installed in their image specifically for this.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No `ports:` — playstat is internal-only. Budgerr's proxy reaches it at
    # http://playstat-api:8000 over the compose network. Never exposed publicly.

volumes:
  playstat_pgdata:
