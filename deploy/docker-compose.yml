name: budgerr-stack

services:
  budgerr-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budgerr
      POSTGRES_PASSWORD: budgerr
      POSTGRES_DB: budgerr
    volumes:
      - budgerr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgerr"]
      interval: 10s
      timeout: 5s
      retries: 5

  budgerr-api:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      budgerr-db:
        condition: service_healthy
    # Secrets (BUDGERR_API_KEYS, AUTH_ENABLED, PLAID_*, PLAYSTAT_API_KEY,
    # NTFY_*, ANTHROPIC_API_KEY) come from backend/.env. The two overrides
    # below repoint the connection URLs at the compose network.
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://budgerr:budgerr@budgerr-db:5432/budgerr
      PLAYSTAT_BASE_URL: http://playstat-api:8000
    ports:
      - "127.0.0.1:8001:8001"   # loopback only: Funnel/serve + systemd cron proxy from localhost; never exposed on the LAN

  playstat-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: playstat
      POSTGRES_PASSWORD: playstat
      POSTGRES_DB: playstat
    volumes:
      - playstat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playstat"]
      interval: 10s
      timeout: 5s
      retries: 5

  playstat-api:
    # Dockerfile is authored and owned by the playstat repo (../../playstat),
    # which Budgerr never writes into. It exists as of playstat 82de4db
    # (python:3.11-slim + libgomp1 for xgboost's runtime OpenMP link + curl).
    # NOTE: this is ONE image with TWO uses — the API service (default CMD)
    # and the daily batch chain (`python -m modeling.clv`, `python -m
    # optimizer.parlay ...`) run as different commands off the same image.
    build:
      context: ../../playstat
    restart: unless-stopped
    depends_on:
      playstat-db:
        condition: service_healthy
    env_file:
      - path: ../../playstat/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://playstat:playstat@playstat-db:5432/playstat
    # playstat's /health is auth-exempt by design (api/auth.py PUBLIC_PATHS), so
    # no API key is needed here. It returns {"status":"ok","database":"ok"}, or
    # 503 when Postgres is unreachable — a real DB check, not just liveness.
    # curl is installed in their image specifically for this.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No `ports:` — playstat is internal-only. Budgerr's proxy reaches it at
    # http://playstat-api:8000 over the compose network. Never exposed publicly.

volumes:
  budgerr_pgdata:
  playstat_pgdata:
